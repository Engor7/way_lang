name: DB Backup

on:
  schedule:
    # Каждый день в 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Clone backup repo
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.BACKUP_REPO_TOKEN }}@github.com/${{ secrets.BACKUP_REPO }}.git" \
            backup-repo

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          mkdir -p backup-repo/backups
          STAMP="$(date -u +%Y-%m-%d_%H%M)"
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges \
            --file="backup-repo/backups/way_lang-${STAMP}.dump"
          cp "backup-repo/backups/way_lang-${STAMP}.dump" backup-repo/latest.dump

      - name: Prune old backups (keep last 30)
        run: |
          cd backup-repo/backups
          ls -1 *.dump | sort | head -n -30 | xargs -r rm --

      - name: Commit and push
        run: |
          cd backup-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Backup $(date -u +%Y-%m-%dT%H:%MZ)" || echo "Nothing to commit"
          git push
