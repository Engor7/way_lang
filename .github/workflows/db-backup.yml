name: DB Backup

on:
  schedule:
    # Каждый день в 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # Диагностика: результат каждого шага показывает, какой секрет настроен неверно
      - name: Check secret BACKUP_REPO is set
        if: always()
        env:
          R: ${{ secrets.BACKUP_REPO }}
        run: test -n "$R"

      - name: Check BACKUP_REPO equals Engor7/way_lang-backups
        if: always()
        env:
          R: ${{ secrets.BACKUP_REPO }}
        run: test "$R" = "Engor7/way_lang-backups"

      - name: Check secret BACKUP_REPO_TOKEN is set
        if: always()
        env:
          T: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: test -n "$T"

      - name: Check secret DATABASE_URL is set
        if: always()
        env:
          D: ${{ secrets.DATABASE_URL }}
        run: test -n "$D"

      - name: Check token can access backup repo
        if: always()
        env:
          T: ${{ secrets.BACKUP_REPO_TOKEN }}
          R: ${{ secrets.BACKUP_REPO }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $T" \
            "https://api.github.com/repos/$R")
          echo "HTTP $code (200=ok, 404=нет доступа или неверное имя, 401=токен невалиден)"
          test "$code" = "200"

      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Clone backup repo
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.BACKUP_REPO_TOKEN }}@github.com/${{ secrets.BACKUP_REPO }}.git" \
            backup-repo

      - name: Check database connection
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # pg_dump должен ходить мимо пулера Neon — убираем -pooler из хоста
          psql "${DATABASE_URL/-pooler/}" -c "select 1"

      - name: Check default pg_dump is version 17
        if: always()
        run: pg_dump --version | grep -q ' 17\.'

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # На раннере предустановлен клиент 16 — берём 17 по полному пути
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump --version
          DATABASE_URL="${DATABASE_URL/-pooler/}"
          mkdir -p backup-repo/backups
          STAMP="$(date -u +%Y-%m-%d_%H%M)"
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges \
            --file="backup-repo/backups/way_lang-${STAMP}.dump"
          cp "backup-repo/backups/way_lang-${STAMP}.dump" backup-repo/latest.dump

      - name: Prune old backups (keep last 30)
        run: |
          cd backup-repo/backups
          ls -1 *.dump | sort | head -n -30 | xargs -r rm --

      - name: Commit and push
        run: |
          cd backup-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Backup $(date -u +%Y-%m-%dT%H:%MZ)" || echo "Nothing to commit"
          git push
